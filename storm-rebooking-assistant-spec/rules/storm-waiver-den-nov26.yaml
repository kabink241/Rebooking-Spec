# Machine-readable form of the Storm Travel Waiver Fare Rules Bulletin (Denver, November 2026).
# Source: Southwest Revenue Management, Pricing and Waiver Policy, issued 2026-11-15.
# Every key carries the bulletin clause it comes from. Do not add rules that are not in the bulletin.
rule_set: storm-waiver-den-nov26
version: 1
issued: 2026-11-15
requests_accepted_through: 2026-11-23        # 1.5, 2.5: later requests go to Revenue Management
input_fields:
  cancelled_bookings_denver_storm: [waiver_eligible, fare_class, fare_paid_usd, earliest_acceptable_departure]
  flight_seat_availability: [flight_status, departure_datetime, fare_class_open]

scope:                                        # 1.1, 1.2
  original_flight_cancelled_between: [2026-11-15, 2026-11-18]
  affected_stations: [DEN, MDW, LAS, PHX, BWI, HOU, DAL, LAX, OAK, SAN, STL, MCO, BNA, SMF]

eligibility:                                  # 1.3, 1.4
  field: waiver_eligible
  agent_may_reassess: false                   # the flag is the decision
  false_means: not_covered                    # handled under not_covered, whatever route or date

flight_filters:
  covered:
    departure_window: [2026-11-18, 2026-11-23]   # 2.1, inclusive
    keep_airport_pair: true                      # 2.2
    usable_status: [scheduled, delayed]          # 2.3, cancelled is never usable
    departure_not_before: earliest_acceptable_departure   # 2.4
  not_covered:
    apply_departure_window: false             # 4.3 cites 2.2 to 2.4 only. UNCONFIRMED, see OQ-02
    keep_airport_pair: true                   # 4.3 via 2.2
    usable_status: [scheduled, delayed]       # 4.3 via 2.3
    departure_not_before: earliest_acceptable_departure   # 4.3 via 2.4
  out_of_scope_goes_to: revenue_management    # 2.5, 4.3
  out_of_scope_cases:
    - request_made_after_requests_accepted_through   # 2.5
    - departure_outside_window_when_covered          # 2.5
    - alternate_airport_request                      # 2.2, 2.5

fare_treatment:
  covered:                                    # Section 3
    fare_difference: none_in_either_direction # 3.1
    fare_paid_usd: carries_over_unchanged     # 3.2
    open_fare_class_must_match_original: false  # 3.3, customer keeps original fare class benefits
    change_fees: not_applied                  # 3.4
    same_day_change_charge: not_applied       # 3.4
    split_party:
      allowed: true                           # 3.5
      penalty: none
      each_flight_must_meet: flight_filters.covered
  not_covered:                                # 4.1, Section 3 does not apply
    change_permitted: [Wanna Get Away, Wanna Get Away Plus, Anytime, Business Select]
    fare_difference: collected_if_open_fare_on_new_flight_is_higher
    refund_of_unused_value: per_standard_fare_rules    # not defined in the bulletin
  loyalty_tier_affects_fare: false            # 4.2 (None, A-List, A-List Preferred)

documentation:                                # 3.6, 4.4
  covered:
    line: "STORM WAIVER DEN NOV26 {original_confirmation_number}"
    record_on: each_rebooked_flight           # split parties get the line on every flight
  not_covered:
    line: none                                # 4.4: never recorded
